apiVersion: v1
kind: ServiceAccount
metadata:
  name: releasepilot-control-plane
  namespace: releasepilot-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: releasepilot-rollout-controller
  namespace: releasepilot-demo
rules:
  - apiGroups: [argoproj.io]
    resources: [rollouts, rollouts/status]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: releasepilot-rollout-controller
  namespace: releasepilot-demo
subjects:
  - kind: ServiceAccount
    name: releasepilot-control-plane
    namespace: releasepilot-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: releasepilot-rollout-controller
