spring:
  application:
    name: releasepilot-control-plane
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/releasepilot}
    username: ${DATABASE_USERNAME:releasepilot}
    password: ${DATABASE_PASSWORD:releasepilot-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 30m

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: RELEASEPILOT_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}] [traceId:%X{traceId:-none}]"

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

releasepilot:
  connection-validation:
    max-age: ${CONNECTION_VALIDATION_MAX_AGE:PT6H}
  environment-revalidation:
    enabled: ${ENVIRONMENT_REVALIDATION_ENABLED:true}
    poll-interval: ${ENVIRONMENT_REVALIDATION_POLL_INTERVAL:PT5M}
    initial-delay: ${ENVIRONMENT_REVALIDATION_INITIAL_DELAY:PT1M}
    max-age: ${ENVIRONMENT_REVALIDATION_MAX_AGE:PT6H}
    failure-retry: ${ENVIRONMENT_REVALIDATION_FAILURE_RETRY:PT15M}
    lease-timeout: ${ENVIRONMENT_REVALIDATION_LEASE_TIMEOUT:PT10M}
    batch-size: ${ENVIRONMENT_REVALIDATION_BATCH_SIZE:20}
  security:
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      cleanup-interval: ${AUTH_RATE_LIMIT_CLEANUP_INTERVAL:PT10M}
      login:
        ip:
          max-attempts: ${LOGIN_RATE_LIMIT_IP_MAX:20}
          window: ${LOGIN_RATE_LIMIT_IP_WINDOW:PT5M}
        account:
          max-attempts: ${LOGIN_RATE_LIMIT_ACCOUNT_MAX:5}
          window: ${LOGIN_RATE_LIMIT_ACCOUNT_WINDOW:PT5M}
      demo:
        ip:
          max-attempts: ${DEMO_RATE_LIMIT_IP_MAX:30}
          window: ${DEMO_RATE_LIMIT_IP_WINDOW:PT1M}
  rollout:
    worker:
      enabled: ${ROLLOUT_WORKER_ENABLED:true}
      poll-interval: ${ROLLOUT_WORKER_POLL_INTERVAL:PT2S}
      lease-timeout: ${ROLLOUT_WORKER_LEASE_TIMEOUT:PT2M}
      batch-size: ${ROLLOUT_WORKER_BATCH_SIZE:20}
  analysis:
    enabled: ${ANALYSIS_ENABLED:true}
    worker-url: ${ANALYSIS_WORKER_URL:http://localhost:8090}
    poll-interval: ${ANALYSIS_POLL_INTERVAL:PT5S}
    lease-timeout: ${ANALYSIS_LEASE_TIMEOUT:PT2M}
    batch-size: ${ANALYSIS_BATCH_SIZE:20}
  demo:
    enabled: ${DEMO_SESSION_ENABLED:false}
    username: ${DEMO_SESSION_USERNAME:releasepilot-demo}
  oidc:
    enabled: ${OIDC_ENABLED:false}
    registration-id: ${OIDC_REGISTRATION_ID:releasepilot}
    auto-provision: ${OIDC_AUTO_PROVISION:false}
    allowed-email-domains: ${OIDC_ALLOWED_EMAIL_DOMAINS:}
  github-checks:
    enabled: ${GITHUB_CHECKS_ENABLED:false}
    secret-ref: ${GITHUB_CHECKS_SECRET_REF:env:GITHUB_CHECKS_TOKEN}
    app-id: ${GITHUB_CHECKS_APP_ID:0}
    installation-id: ${GITHUB_CHECKS_INSTALLATION_ID:0}
    private-key-path: ${GITHUB_CHECKS_PRIVATE_KEY_PATH:}
    poll-interval: ${GITHUB_CHECKS_POLL_INTERVAL:PT5S}
    lease-timeout: ${GITHUB_CHECKS_LEASE_TIMEOUT:PT2M}
    batch-size: ${GITHUB_CHECKS_BATCH_SIZE:20}
  audit:
    archive:
      enabled: ${AUDIT_ARCHIVE_ENABLED:false}
      provider: ${AUDIT_ARCHIVE_PROVIDER:http}
      endpoint: ${AUDIT_ARCHIVE_ENDPOINT:http://localhost:9080/audit/}
      token: ${AUDIT_ARCHIVE_TOKEN:}
      poll-interval: ${AUDIT_ARCHIVE_POLL_INTERVAL:PT10S}
      s3:
        bucket: ${AUDIT_ARCHIVE_S3_BUCKET:}
        prefix: ${AUDIT_ARCHIVE_S3_PREFIX:audit-events}
  bootstrap-operator:
    enabled: ${BOOTSTRAP_OPERATOR_ENABLED:false}
    username: ${BOOTSTRAP_OPERATOR_USERNAME:operator}
    password: ${BOOTSTRAP_OPERATOR_PASSWORD:}
    display-name: ${BOOTSTRAP_OPERATOR_DISPLAY_NAME:ReleasePilot Operator}
