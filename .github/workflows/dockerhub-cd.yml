name: Docker Hub CD
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/dockerhub-cd.yml'
      - 'scripts/select_dockerhub_images.py'
      - 'scripts/update_releasepilot_images.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dockerhub-cd-main
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - id: select
        name: Select changed image inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            matrix="$(python scripts/select_dockerhub_images.py --all)"
          else
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > changed-paths.txt
            matrix="$(python scripts/select_dockerhub_images.py changed-paths.txt)"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  publish:
    needs: [validate, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          tags: automaster5013/releasepilot-${{ matrix.name }}:${{ github.sha }}
      - name: Block fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: automaster5013/releasepilot-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: index.docker.io/automaster5013/releasepilot-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify provenance before GitOps
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: index.docker.io/automaster5013/releasepilot-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY"
      - name: Record pinned image
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s=automaster5013/releasepilot-%s@%s\n' "$IMAGE_NAME" "$IMAGE_NAME" "$IMAGE_DIGEST" > "dockerhub-$IMAGE_NAME.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dockerhub-${{ matrix.name }}
          path: dockerhub-${{ matrix.name }}.txt
  update-gitops:
    needs: publish
    if: vars.DOCKERHUB_AUTO_DEPLOY != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dockerhub-*
          merge-multiple: true
      - name: Update deployment only for the current source
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "A newer main commit exists; deployment skipped."
            exit 0
          fi
          cat dockerhub-*.txt > image-digests.txt
          python scripts/update_releasepilot_images.py image-digests.txt deploy/overlays/aws-demo/kustomization.yaml
          git config user.name releasepilot-bot
          git config user.email releasepilot-bot@users.noreply.github.com
          git add deploy/overlays/aws-demo/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: Docker Hub ReleasePilot $RELEASE_SHA"
          git push origin HEAD:main
  verify-deployment:
    needs: update-gitops
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dockerhub-*
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Configure read-only EKS access
        run: aws eks update-kubeconfig --name releasepilot-demo --region ap-northeast-2
      - name: Wait for GitOps sync and Canary approval boundary
        run: |
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            app_sync=$(kubectl get application releasepilot-demo -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            ready=true
            for file in dockerhub-*.txt; do
              name="$(cut -d= -f1 "$file")"
              expected="$(cut -d= -f2- "$file")"
              actual="$(kubectl get rollout "$name" -n releasepilot -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
              phase="$(kubectl get rollout "$name" -n releasepilot -o jsonpath='{.status.phase}' 2>/dev/null || true)"
              updated="$(kubectl get rollout "$name" -n releasepilot -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || true)"
              if [ "$actual" != "$expected" ] || { [ "$phase" != "Paused" ] && [ "$phase" != "Healthy" ]; } || [ "${updated:-0}" -lt 1 ]; then
                ready=false
              fi
            done
            if [ "$app_sync" = "Synced" ] && [ "$ready" = true ] && curl --fail --silent --show-error --max-time 10 https://releasepilot.kr/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          kubectl get application releasepilot-demo -n argocd || true
          kubectl get rollouts -n releasepilot || true
          exit 1
