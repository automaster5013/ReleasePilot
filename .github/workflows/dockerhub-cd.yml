name: Docker Hub CD
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dockerhub-cd-main
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            context: apps/control-plane
          - name: analysis-worker
            context: apps/analysis-worker
          - name: web-console
            context: apps/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          tags: automaster5013/releasepilot-${{ matrix.name }}:${{ github.sha }}
      - name: Record pinned image
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s=automaster5013/releasepilot-%s@%s\n' "$IMAGE_NAME" "$IMAGE_NAME" "$IMAGE_DIGEST" > "dockerhub-$IMAGE_NAME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dockerhub-${{ matrix.name }}
          path: dockerhub-${{ matrix.name }}.txt
  update-gitops:
    needs: publish
    if: vars.DOCKERHUB_AUTO_DEPLOY != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: dockerhub-*
          merge-multiple: true
      - name: Update deployment only for the current source
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "A newer main commit exists; deployment skipped."
            exit 0
          fi
          cat dockerhub-*.txt > image-digests.txt
          python scripts/update_releasepilot_images.py image-digests.txt deploy/overlays/aws-demo/kustomization.yaml
          git config user.name releasepilot-bot
          git config user.email releasepilot-bot@users.noreply.github.com
          git add deploy/overlays/aws-demo/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: Docker Hub ReleasePilot $RELEASE_SHA"
          git push origin HEAD:main
