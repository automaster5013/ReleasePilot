name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash mvnw --batch-mode verify

  analysis-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analysis-worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.13'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  web-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-console
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: web-console-e2e-failure
          path: |
            apps/web-console/playwright-report/
            apps/web-console/test-results/
          retention-days: 7

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: pip install jsonschema pyyaml
      - run: python -m unittest discover -s scripts -p test_public_ingress.py
      - run: python -m unittest discover -s scripts -p test_release_ci_gate.py
      - run: python -m unittest discover -s scripts -p test_dockerhub_cd.py
      - name: Verify project log management
        shell: pwsh
        run: ./scripts/Test-ProjectLogManagement.ps1
      - name: Validate release policy example
        run: >-
          python -c "import json,jsonschema,pathlib;
          s=json.loads(pathlib.Path('policies/schema/release-policy.schema.json').read_text());
          examples=pathlib.Path('policies/examples').glob('*.json');
          [jsonschema.validate(json.loads(p.read_text()),s) for p in examples]"
      - name: Parse API and query templates
        run: >-
          python -c "import pathlib,yaml;
          yaml.safe_load(pathlib.Path('api/openapi/releasepilot-v1.yaml').read_text());
          yaml.safe_load(pathlib.Path('config/observability/query-templates-v1.yaml').read_text())"

  mysql-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: docker pull mysql:8.4
      - run: python scripts/mysql_restore_drill.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python scripts/analysis_mysql_integration.py
