name: Release images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  pull-requests: write
env:
  AWS_REGION: ap-northeast-2
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: control-plane
            context: apps/control-plane
          - name: analysis-worker
            context: apps/analysis-worker
          - name: web-console
            context: apps/web-console
    steps:
      - uses: actions/checkout@v4
      - name: Inspect OIDC subject
        shell: bash
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          TOKEN="$token" python -c 'import base64,json,os; payload=os.environ["TOKEN"].split(".")[1]; payload += "=" * (-len(payload) % 4); print("OIDC subject:", json.loads(base64.urlsafe_b64decode(payload))["sub"])'
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/releasepilot/${{ matrix.name }}:${{ github.sha }}
      - name: Record immutable digest
        run: echo '${{ matrix.name }}=${{ steps.ecr.outputs.registry }}/releasepilot/${{ matrix.name }}@${{ steps.build.outputs.digest }}' > 'digest-${{ matrix.name }}.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt
  update-gitops:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: digest-*, merge-multiple: true }
      - uses: actions/checkout@v4
      - name: Update pinned image digests
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat digest-*.txt > image-digests.txt
          python scripts/update_releasepilot_images.py image-digests.txt deploy/overlays/aws-demo/kustomization.yaml
          git config user.name releasepilot-bot
          git config user.email releasepilot-bot@users.noreply.github.com
          git checkout -b "releasepilot/$RELEASE_SHA"
          git add deploy/overlays/aws-demo/kustomization.yaml
          git commit -m "deploy: ReleasePilot $RELEASE_SHA"
          git push origin HEAD
          gh pr create --title "Deploy ReleasePilot $RELEASE_SHA" --body "Images are pinned by digest." --base main
