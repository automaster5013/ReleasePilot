name: Release images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
env:
  AWS_REGION: ap-northeast-2
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: control-plane
            context: apps/control-plane
          - name: analysis-worker
            context: apps/analysis-worker
          - name: web-console
            context: apps/web-console
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Reuse an existing immutable image
        id: existing
        env:
          REPOSITORY: releasepilot/${{ matrix.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [[ "$digest" == sha256:* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.existing.outputs.exists != 'true'
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/releasepilot/${{ matrix.name }}:${{ github.sha }}
      - name: Record immutable digest
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: echo '${{ matrix.name }}=${{ steps.ecr.outputs.registry }}/releasepilot/${{ matrix.name }}@'"${BUILT_DIGEST:-$EXISTING_DIGEST}" > 'digest-${{ matrix.name }}.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt
  update-gitops:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: digest-*, merge-multiple: true }
      - name: Update pinned image digests
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat digest-*.txt > image-digests.txt
          python scripts/update_releasepilot_images.py image-digests.txt deploy/overlays/aws-demo/kustomization.yaml
          git config user.name releasepilot-bot
          git config user.email releasepilot-bot@users.noreply.github.com
          git add deploy/overlays/aws-demo/kustomization.yaml
          git commit -m "deploy: ReleasePilot $RELEASE_SHA"
          git push origin main
