name: Release images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
env:
  AWS_REGION: ap-northeast-2
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: control-plane
            context: apps/control-plane
          - name: analysis-worker
            context: apps/analysis-worker
          - name: web-console
            context: apps/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Reuse an existing immutable image
        id: existing
        env:
          REPOSITORY: releasepilot/${{ matrix.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [[ "$digest" == sha256:* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/releasepilot/${{ matrix.name }}:${{ github.sha }}
      - name: Record immutable digest
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: echo '${{ matrix.name }}=${{ steps.ecr.outputs.registry }}/releasepilot/${{ matrix.name }}@'"${BUILT_DIGEST:-$EXISTING_DIGEST}" > 'digest-${{ matrix.name }}.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt
  update-gitops:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with: { pattern: digest-*, merge-multiple: true }
      - name: Update pinned image digests
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat digest-*.txt > image-digests.txt
          python scripts/update_releasepilot_images.py image-digests.txt deploy/overlays/aws-demo/kustomization.yaml
          git config user.name releasepilot-bot
          git config user.email releasepilot-bot@users.noreply.github.com
          git add deploy/overlays/aws-demo/kustomization.yaml
          git commit -m "deploy: ReleasePilot $RELEASE_SHA"
          git push origin main
