services:
  control-plane:
    environment:
      OTEL_TRACING_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      otel-collector:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.6.0
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['9090:9090']
  loki:
    image: grafana/loki:3.5.5
    command: [-config.file=/etc/loki/local-config.yaml]
    ports: ['3100:3100']
  promtail:
    image: grafana/promtail:3.5.5
    command: [-config.file=/etc/promtail/config.yml]
    volumes:
      - ./config/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./config/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ['4317:4317', '4318:4318']
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3001:3000']
    depends_on: [prometheus, loki]
