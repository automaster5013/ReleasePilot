apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: releasepilot-production-deploy-verifier }
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "applications"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: releasepilot-production-deploy-verifier }
subjects:
  - { kind: Group, name: releasepilot-production-deploy-verifier, apiGroup: rbac.authorization.k8s.io }
roleRef: { kind: ClusterRole, name: releasepilot-production-deploy-verifier, apiGroup: rbac.authorization.k8s.io }
