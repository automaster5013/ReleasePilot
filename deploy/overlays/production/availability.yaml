apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: control-plane }
spec: { minAvailable: 1, selector: { matchLabels: { app: control-plane } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: web-console }
spec: { minAvailable: 1, selector: { matchLabels: { app: web-console } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: control-plane }
spec:
  scaleTargetRef: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: control-plane }
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web-console }
spec:
  scaleTargetRef: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: web-console }
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
