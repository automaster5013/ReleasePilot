apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: aws-secrets-manager }
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: releasepilot-runtime }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target:
    name: releasepilot-runtime
    creationPolicy: Owner
  dataFrom:
    - extract: { key: releasepilot/production/runtime }
