- op: add
  path: /spec/template/spec/securityContext
  value:
    fsGroup: 10001
- op: add
  path: /spec/template/spec/initContainers
  value:
  - name: trust-cluster-ca
    image: control-plane:latest
    command:
    - sh
    - -ec
    args:
    - 'cp "$JAVA_HOME/lib/security/cacerts" /cluster-trust/cacerts

      keytool -importcert -noprompt -alias releasepilot-cluster-ca -file /connector-credentials/ca.crt
      -keystore /cluster-trust/cacerts -storepass changeit

      '
    volumeMounts:
    - name: connector-credentials
      mountPath: /connector-credentials
      readOnly: true
    - name: cluster-trust
      mountPath: /cluster-trust
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
- op: add
  path: /spec/template/spec/volumes
  value:
  - name: connector-credentials
    projected:
      defaultMode: 288
      sources:
      - serviceAccountToken:
          path: connector-token
          expirationSeconds: 600
      - configMap:
          name: kube-root-ca.crt
          items:
          - key: ca.crt
            path: ca.crt
      - secret:
          name: releasepilot-github-checks
          items:
          - key: private-key.pem
            path: github-checks-private-key.pem
  - name: cluster-trust
    emptyDir:
      sizeLimit: 4Mi
- op: add
  path: /spec/template/spec/containers/0/volumeMounts
  value:
  - name: connector-credentials
    mountPath: /connector-credentials
    readOnly: true
  - name: cluster-trust
    mountPath: /cluster-trust
    readOnly: true
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: RELEASEPILOT_SECRETS_FILE_ROOT
    value: /connector-credentials
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: JAVA_TOOL_OPTIONS
    value: -Djavax.net.ssl.trustStore=/cluster-trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: GITHUB_CHECKS_ENABLED
    value: "true"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: GITHUB_CHECKS_APP_ID
    value: "4993433"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: GITHUB_CHECKS_INSTALLATION_ID
    value: "162831833"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: GITHUB_CHECKS_PRIVATE_KEY_PATH
    value: /connector-credentials/github-checks-private-key.pem
