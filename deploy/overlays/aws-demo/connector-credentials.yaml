apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: control-plane
spec:
  template:
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: trust-cluster-ca
          image: control-plane:latest
          command: [sh, -ec]
          args:
            - |
              cp "$JAVA_HOME/lib/security/cacerts" /cluster-trust/cacerts
              keytool -importcert -noprompt -alias releasepilot-cluster-ca -file /connector-credentials/ca.crt -keystore /cluster-trust/cacerts -storepass changeit
          volumeMounts:
            - { name: connector-credentials, mountPath: /connector-credentials, readOnly: true }
            - { name: cluster-trust, mountPath: /cluster-trust }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
      containers:
        - name: control-plane
          env:
            - { name: RELEASEPILOT_SECRETS_FILE_ROOT, value: /connector-credentials }
            - { name: JAVA_TOOL_OPTIONS, value: '-Djavax.net.ssl.trustStore=/cluster-trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit' }
          volumeMounts:
            - { name: connector-credentials, mountPath: /connector-credentials, readOnly: true }
            - { name: cluster-trust, mountPath: /cluster-trust, readOnly: true }
      volumes:
        - name: connector-credentials
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: { path: connector-token, expirationSeconds: 600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
        - name: cluster-trust
          emptyDir: { sizeLimit: 4Mi }
