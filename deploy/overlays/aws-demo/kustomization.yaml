  - name: web-console
    newName: 327771416502.dkr.ecr.ap-northeast-2.amazonaws.com/releasepilot/web-console
    digest: sha256:59c4e6db05a22547c72ef2202a2548a855b2212735cd0a5f5e37b81e5a4e3b93
patches:
