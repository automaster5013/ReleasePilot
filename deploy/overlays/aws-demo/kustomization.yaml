apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: releasepilot
resources: [../../base, ingress.yaml, issuer.yaml, network-policy.yaml, storage-class.yaml]
images:
  - name: control-plane
    newName: automaster5013/releasepilot-control-plane
    digest: sha256:27c581eb0d3443fc43ddf6657562c7f78a0327b1ce71ed7d5a68d30628252b07
  - name: analysis-worker
    newName: automaster5013/releasepilot-analysis-worker
    digest: sha256:adc998065d69f976df6122f555883e087bbfede05b9b9b40eb061fa6dfa9ac9d
  - name: web-console
    newName: automaster5013/releasepilot-web-console
    digest: sha256:11754705b3804da445a8afd058da1feac4946eee68b05854ac2e06cf67991661
patches:
  - target: { kind: Rollout, name: control-plane }
    path: connector-credentials.yaml
  - target: { kind: Rollout }
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value: { releasepilot.kr/release: v0.52.0 }
  - target: { kind: Rollout, name: control-plane }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_ENABLED, value: "true" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_PROVIDER, value: "s3" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_S3_BUCKET, value: "releasepilot-demo-audit-327771416502" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AWS_REGION, value: "ap-northeast-2" }
