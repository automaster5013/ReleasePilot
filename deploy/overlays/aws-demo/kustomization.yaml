apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: releasepilot
resources: [../../base, ingress.yaml, issuer.yaml, network-policy.yaml, storage-class.yaml, deployment-verifier-rbac.yaml]
images:
  - name: control-plane
    newName: automaster5013/releasepilot-control-plane
    digest: sha256:79d977a4c80a78718111f2e969c5105220e39b86a14e4e2bbbaf3de2b38679c2
  - name: analysis-worker
    newName: automaster5013/releasepilot-analysis-worker
    digest: sha256:01697a308cf3b1eaf10cd57d231e2061a5086f30dc08e8c62af88f2e152db2f1
  - name: web-console
    newName: automaster5013/releasepilot-web-console
    digest: sha256:dba9d769621cb0d524ec8c764abd631b107380ae95ae133a659e6a19d53744a8
patches:
  - target: { kind: Rollout, name: control-plane }
    path: connector-credentials.yaml
  - target: { kind: Rollout }
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value: { releasepilot.kr/release: v0.52.0 }
  - target: { kind: Rollout, name: control-plane }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_ENABLED, value: "true" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_PROVIDER, value: "s3" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_S3_BUCKET, value: "releasepilot-demo-audit-327771416502" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AWS_REGION, value: "ap-northeast-2" }
