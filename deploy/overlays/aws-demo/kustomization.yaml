apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: releasepilot
resources: [../../base, ingress.yaml, issuer.yaml, network-policy.yaml, storage-class.yaml]
images:
  - name: control-plane
    newName: 327771416502.dkr.ecr.ap-northeast-2.amazonaws.com/releasepilot/control-plane
    digest: sha256:d76fa3ab55fc8b53ac4b39f6c43081a62a702786392b3f58615aaf11b80f3560
  - name: analysis-worker
    newName: 327771416502.dkr.ecr.ap-northeast-2.amazonaws.com/releasepilot/analysis-worker
    digest: sha256:98003b11cc1f1aa807cf9dbf36957bdaaf609b5612337c5ceb8c26eccef2535a
  - name: web-console
    newName: 327771416502.dkr.ecr.ap-northeast-2.amazonaws.com/releasepilot/web-console
    digest: sha256:e4417839ed4a286ca43fac3cc8c14f2a02c7bbc05fad5712d56e3658406129ff
patches:
  - target: { kind: Rollout, name: control-plane }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_ENABLED, value: "true" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_PROVIDER, value: "s3" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AUDIT_ARCHIVE_S3_BUCKET, value: "releasepilot-demo-audit-327771416502" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: AWS_REGION, value: "ap-northeast-2" }
