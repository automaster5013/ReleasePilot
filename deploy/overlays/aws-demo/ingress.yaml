apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: releasepilot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls: [{ hosts: [releasepilot.kr], secretName: releasepilot-tls }]
  rules:
    - host: releasepilot.kr
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: control-plane, port: { number: 8080 } } } }
          - { path: /actuator, pathType: Prefix, backend: { service: { name: control-plane, port: { number: 8080 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web-console, port: { number: 3000 } } } }
