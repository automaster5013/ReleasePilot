apiVersion: v1
kind: Service
metadata: { name: mysql }
spec:
  clusterIP: None
  selector: { app: mysql }
  ports: [{ name: mysql, port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql }
spec:
  serviceName: mysql
  replicas: 1
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: releasepilot }
            - { name: MYSQL_USER, value: releasepilot }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: releasepilot-runtime, key: DATABASE_PASSWORD } } }
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: releasepilot-runtime, key: MYSQL_ROOT_PASSWORD } } }
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: auto-ebs-sc
        volumeMode: Filesystem
        resources: { requests: { storage: 10Gi } }
