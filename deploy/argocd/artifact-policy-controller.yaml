apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artifact-policy-controller
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/sigstore/helm-charts
      chart: policy-controller
      targetRevision: 0.10.5
      helm:
        releaseName: policy-controller
        valueFiles:
          - $values/deploy/security/policy-controller-values.yaml
    - repoURL: https://github.com/automaster5013/ReleasePilot.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: artifact-attestations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        # policy-controller expands the chart's bootstrap webhook at runtime.
        - /webhooks
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
