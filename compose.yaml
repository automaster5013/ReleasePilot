name: releasepilot

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-releasepilot}
      MYSQL_USER: ${MYSQL_USER:-releasepilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-releasepilot-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-releasepilot-root-local}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-releasepilot-root-local}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  control-plane:
    build:
      context: ./apps/control-plane
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-releasepilot}
      DATABASE_USERNAME: ${MYSQL_USER:-releasepilot}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-releasepilot-local}
      SERVER_PORT: 8080
      SESSION_COOKIE_SECURE: 'false'
      DEMO_SESSION_ENABLED: ${DEMO_SESSION_ENABLED:-false}
      ANALYSIS_WORKER_URL: http://analysis-worker:8090
      ANALYSIS_WORKER_SHARED_TOKEN: ${ANALYSIS_WORKER_SHARED_TOKEN:-releasepilot-worker-local}
      CONNECTION_VALIDATION_ALLOWED_HOSTS: ${CONNECTION_VALIDATION_ALLOWED_HOSTS:-prometheus}
    ports:
      - '${CONTROL_PLANE_PORT:-8080}:8080'
    depends_on:
      mysql:
        condition: service_healthy
      analysis-worker:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 3s
      retries: 10

  analysis-worker:
    build:
      context: ./apps/analysis-worker
    ports:
      - '127.0.0.1:${ANALYSIS_WORKER_PORT:-8090}:8090'
    environment:
      ANALYSIS_WORKER_SHARED_TOKEN: ${ANALYSIS_WORKER_SHARED_TOKEN:-releasepilot-worker-local}
      PROMETHEUS_ALLOWED_HOSTS: ${CONNECTION_VALIDATION_ALLOWED_HOSTS:-prometheus}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web-console:
    build:
      context: ./apps/web-console
    ports:
      - '${WEB_CONSOLE_PORT:-3000}:3000'
    environment:
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8080
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
